<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore the XLSX viewer with its plain JavaScript API." />
    <meta name="theme-color" content="#f4f8f5" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/vanilla/style.css" />
    <title>Vanilla JS · XLSX Playground</title>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="Return to the React playground">
          <img src="/favicon.svg" alt="" width="30" height="30" />
          <span>XLSX <span class="brand-muted">Playground</span></span>
        </a>
        <a class="back-link" href="/">
          <span aria-hidden="true">←</span> React playground
        </a>
      </header>

      <main class="main-content">
        <section class="page-intro" aria-labelledby="page-title">
          <div>
            <div class="eyebrow"><span class="eyebrow-dot"></span> JAVASCRIPT PLAYGROUND</div>
            <h1 id="page-title">Spreadsheets for plain JavaScript.</h1>
            <p>Open a workbook and explore the viewer’s imperative API.</p>
          </div>
          <div class="entry-label">
            <span>IMPORT FROM</span>
            <code>@extend-ai/react-xlsx/vanilla</code>
          </div>
        </section>

        <section class="workspace" aria-label="Workbook viewer">
          <div class="workspace-toolbar">
            <div class="toolbar-primary">
              <button class="button button-primary" id="open-file" type="button">
                <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M3 6.5a2 2 0 0 1 2-2h3l1.5 1.7H15a2 2 0 0 1 2 2v6.3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M10 13V8.5m-2 2 2-2 2 2"/></svg>
                Open workbook
              </button>
              <input id="file-input" type="file" accept=".xlsx,.xlsm,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden />
              <button class="button button-quiet" id="load-sample" type="button">Load sample</button>
              <span class="toolbar-divider" aria-hidden="true"></span>
              <form class="url-form" id="url-form">
                <label class="sr-only" for="workbook-url">Workbook URL</label>
                <input id="workbook-url" type="url" placeholder="Workbook URL" />
                <button class="button button-quiet" type="submit">Open URL</button>
              </form>
            </div>
            <div class="toolbar-options">
              <label class="check-option"><input id="read-only" type="checkbox" /><span>Read only</span></label>
              <label class="check-option"><input id="dark-mode" type="checkbox" /><span>Dark</span></label>
            </div>
          </div>

          <div class="workbook-meta">
            <div class="workbook-label">
              <span class="workbook-icon" aria-hidden="true">▦</span>
              <div><strong id="file-name">Workbook</strong><span id="sheet-name">Preparing viewer</span></div>
            </div>
            <div class="status" id="status" role="status" aria-live="polite"><span class="status-dot"></span><span id="status-text">Starting</span></div>
          </div>

          <div class="viewer-stage"><div id="viewer"></div></div>

          <div class="workspace-footer">
            <form class="highlight-form" id="highlight-form">
              <label for="range-input">Highlight</label>
              <input id="range-input" placeholder="A1:D5" autocomplete="off" />
              <button class="button button-quiet" id="highlight-button" type="submit" disabled>Apply</button>
              <button class="button button-text" id="clear-highlights" type="button" disabled>Clear</button>
            </form>
            <div class="footer-actions">
              <span class="selection-label">Selection <strong id="selection">—</strong></span>
              <button class="button button-quiet" id="export" type="button" disabled>Export XLSX</button>
            </div>
          </div>
        </section>
        <p class="page-note" id="message" role="status" aria-live="polite">Select a cell, or open a workbook to get started.</p>
      </main>
    </div>
    <script type="module" src="/vanilla/main.js"></script>
  </body>
</html>
